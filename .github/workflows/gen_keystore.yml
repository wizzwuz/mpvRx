name: Generate Keystore
on: workflow_dispatch
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=mpvRx,O=mpvRx,C=US"
          keytool -list -v -keystore release.keystore -storepass android
          echo "BASE64_START"
          base64 -w 0 release.keystore
          echo ""
          echo "BASE64_END"
